# =============================================================================
# configs/base.yaml — Base configuration shared by all experiments
# =============================================================================

project:
  name: "autoassess"
  experiment: "baseline"          # overridden per-run
  seed: 42
  project_root: "."               # relative to repo root; resolved at runtime
  output_root: "runs"             # all experiment outputs land here

data:
  raw_dir:       "data/raw"
  interim_dir:   "data/interim"
  processed_dir: "data/processed"
  dataset_name:  "car_damage"     # sub-folder name inside processed_dir
  # YOLO-format dataset YAML is generated by preprocess script
  dataset_yaml:  "data/processed/car_damage/dataset.yaml"
  num_workers:   4
  train_split:   0.70
  val_split:     0.15
  test_split:    0.15
  imgsz:         640

model:
  architecture:  "yolov8"         # "yolov8" | "maskrcnn"
  variant:       "yolov8n-seg"    # yolov8n-seg | yolov8s-seg
  pretrained:    true
  num_classes:   3                # adjust to actual class count
  class_names:   ["minor", "moderate", "severe"]

train:
  epochs:        50
  batch:         8
  device:        "0"              # GPU index or "cpu"
  amp:           true             # mixed precision
  optimizer:     "AdamW"
  lr0:           0.001
  lrf:           0.01             # final lr factor
  momentum:      0.937
  weight_decay:  0.0005
  warmup_epochs: 3
  patience:      20               # early-stopping patience (epochs)
  save_period:   5                # save checkpoint every N epochs

augmentation:
  hsv_h:   0.015
  hsv_s:   0.7
  hsv_v:   0.4
  degrees:  0.0
  translate: 0.1
  scale:    0.5
  fliplr:   0.5
  mosaic:   1.0
  mixup:    0.0

eval:
  conf_threshold: 0.25
  iou_threshold:  0.45
  max_det:        300

infer:
  conf_threshold: 0.30
  iou_threshold:  0.45
  max_det:        50
  save_txt:       false
  save_conf:      true
  line_thickness: 2
  hide_labels:    false
  hide_conf:      false
