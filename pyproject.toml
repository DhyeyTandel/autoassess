[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoassess"
version = "0.1.0"
description = "Automated vehicle damage localisation and severity grading for motor insurance claims."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhyey Tandel" }]
keywords = ["computer-vision", "object-detection", "instance-segmentation", "insurance", "yolov8"]

dependencies = [
    # deep learning
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    # detection / segmentation
    "ultralytics>=8.2.0",
    # image processing & augmentation
    "opencv-python>=4.10.0",
    "albumentations>=1.4.0",
    # data & visualisation
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    # config & utilities
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    # image handling
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "pycocotools>=2.0.11",
    # demo UI
    "gradio>=4.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]

[project.scripts]
autoassess-train          = "autoassess.train.train:main"
autoassess-train-yolo     = "autoassess.train.train_yolo:main"
autoassess-train-maskrcnn = "autoassess.train.train_maskrcnn:main"
autoassess-train-severity = "autoassess.train.train_severity:main"
autoassess-eval           = "autoassess.eval.evaluate:main"
autoassess-compare        = "autoassess.eval.compare:main"
autoassess-severity-eval  = "autoassess.eval.severity_eval:main"
autoassess-infer          = "autoassess.infer.infer:main"
autoassess-prep           = "autoassess.data.prepare:main"
autoassess-convert        = "autoassess.data.convert:main"
autoassess-verify         = "autoassess.data.verify:main"
autoassess-carparts       = "autoassess.data.carparts:main"
autoassess-train-parts    = "autoassess.train.train_parts:main"
autoassess-associate      = "autoassess.infer.associate:main"
autoassess-pipeline       = "autoassess.infer.pipeline:main"
autoassess-report         = "autoassess.eval.report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoassess"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/autoassess"]
